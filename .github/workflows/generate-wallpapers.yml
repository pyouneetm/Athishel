name: Generate JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Gallery/**'
      - 'lumina/**'

jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate wallpapers.json
        run: |
          echo "Generating wallpapers.json..."
          
          GALLERY_FILES=$(cd Gallery && find . -type f 2>/dev/null | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]') || GALLERY_FILES="[]"
          LUMINA_FILES=$(cd lumina && find . -type f 2>/dev/null | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]') || LUMINA_FILES="[]"
          
          [ -z "$GALLERY_FILES" ] && GALLERY_FILES="[]"
          [ -z "$LUMINA_FILES" ] && LUMINA_FILES="[]"
          
          jq -n \
            --argjson gallery "$GALLERY_FILES" \
            --argjson lumina "$LUMINA_FILES" \
            '{gallery: $gallery, lumina: $lumina}' > wallpapers.json
            
      - name: Generate uploaders.json
        run: |
          echo "Generating uploaders.json..."
          echo "{}" > uploaders.json
          find Gallery lumina -type f -print0 2>/dev/null | while IFS= read -r -d '' file; do
            author=$(git log --diff-filter=A --format="%an" -1 -- "$file")
            [ -z "$author" ] && author="Unknown"
            rel_path=$(echo "$file" | sed -e 's|^Gallery/||' -e 's|^lumina/||')
            jq --arg f "$rel_path" --arg a "$author" '.[$f] = $a' uploaders.json > tmp.json && mv tmp.json uploaders.json
          done

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add wallpapers.json uploaders.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-generate JSON files [skip ci]"
            git push
          fi
